<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收件台 · 管理</title><link rel="stylesheet" href="/ui/site.css"><script type="module" src="/ui/admin.js"></script></head>
<body><div class="shell"><aside><div class="brand">收件台<span>MAIL DESK / SERVER</span></div><nav aria-label="管理导航"><button data-view="inventory" class="nav active">邮箱总览</button><button data-view="accounts" class="nav">iCloud 账号</button><button data-view="grants" class="nav">永久分发</button><button data-view="keys" class="nav">接口密钥</button><button data-view="audit" class="nav">操作记录</button></nav><div class="aside-note">账号独立 · 权限分离<br>收件授权默认永久有效</div><button id="logout" class="quiet">退出登录</button></aside>
<main><header><div><p class="eyebrow">YOUR MAIL, ORGANIZED</p><h1 id="heading">邮箱总览</h1><p class="muted">一个后台查看全部账号，每个邮箱始终保留清晰归属。</p></div><div class="actions"><button id="scan-mail">扫描全部收件</button><button id="refresh">刷新状态</button></div></header><p id="notice" role="status" aria-live="polite"></p>
<section id="login" class="login card"><h2>登录管理后台</h2><p class="muted">仅管理员可管理账号与分发。首次账号在服务器本地初始化。</p><form id="login-form"><label>管理员名称<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button></form></section>
<div id="workspace" hidden><section id="stats" class="stats"></section><div class="toolbar"><label>账号<select id="account-filter"><option value="">全部账号</option></select></label><label>搜索<input id="search" placeholder="邮箱、标签、分发对象"></label><label>分发状态<select id="status-filter"><option value="">全部状态</option><option value="unassigned">未分发</option><option value="active">已分发</option><option value="revoked">已撤销</option></select></label><button id="distribute-selected" class="primary">分发选中邮箱</button><button id="add-account">新增账号</button></div><section id="content"></section></div>
</main></div><dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" class="quiet" aria-label="关闭">×</button></div><div id="dialog-body"></div><p id="dialog-error" role="alert"></p><button id="dialog-submit" class="primary">确认</button></form></dialog></body></html>
