<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #15202b;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .status {
        padding: 10px;
        border-radius: 8px;
        background: #f1f5f9;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      button {
        width: 100%;
        margin-top: 10px;
        min-height: 34px;
        border: 0;
        border-radius: 7px;
        color: white;
        background: #0bbf72;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        color: #15202b;
        background: #e2e8f0;
      }
      label {
        display: block;
        margin-top: 14px;
        font-size: 12px;
        font-weight: 700;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        min-height: 30px;
        padding: 0 8px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 12px;
      }
      .hint {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.5;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <h1>iCloud Cookie Bridge · Chrome</h1>
    <div class="status" id="status">读取状态中...</div>
    <button id="syncBtn">立即同步</button>
    <label for="bridgePort">本地服务端口</label>
    <input id="bridgePort" type="number" min="1" max="65535" step="1" autocomplete="off" placeholder="4173" />
    <div class="hint">固定发往 127.0.0.1，只有端口可改（服务不监听 localhost/::1）。</div>
    <label for="apiKey">本地服务 API key</label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴当前实例 api-key.txt 的内容" />
    <div class="hint" id="keyHint">未保存 API key。</div>
    <button id="saveBtn" class="secondary">保存设置</button>
    <script src="popup.js"></script>
  </body>
</html>
