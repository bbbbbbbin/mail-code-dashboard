<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>专属收件箱</title><link rel="stylesheet" href="/ui/site.css"><script type="module" src="/ui/inbox.js"></script></head><body class="inbox-page"><main class="inbox-main"><header><div><p class="eyebrow">YOUR PRIVATE INBOX</p><h1>专属收件箱</h1><p class="muted" id="mailbox-name">输入分发给你的 Token，查看对应邮箱的邮件。</p></div><button id="logout" hidden>退出</button></header><p id="notice" role="status" aria-live="polite"></p><form id="login-form" class="card login"><label>收件 Token<input name="token" type="password" autocomplete="off" spellcheck="false" required placeholder="粘贴你的专属 Token"></label><button class="primary">进入收件箱</button><p class="muted">授权永久有效，除非管理员撤销或重置。请勿公开分享 Token。</p></form><section id="mailbox" hidden><div class="toolbar"><span class="badge">永久授权</span><span class="muted">每 15 秒刷新 · 仅展示授权范围内的邮件</span><button id="refresh">立即刷新</button></div><div id="messages"></div></section></main></body></html>
