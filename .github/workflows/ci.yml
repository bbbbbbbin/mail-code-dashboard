name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: node --test extensions/chrome-cookie-bridge/test/background.test.mjs
      - run: python extensions/chrome-cookie-bridge/scripts/validate_extension.py
      - run: node scripts/check-distribution.mjs
