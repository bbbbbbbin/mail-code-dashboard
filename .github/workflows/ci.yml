name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: node --test extensions/chrome-cookie-bridge/test/background.test.mjs
      - run: python extensions/chrome-cookie-bridge/scripts/validate_extension.py
      - run: node scripts/check-distribution.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker build --target runtime -t mail-dashboard-test .
      - run: docker build --target test -t mail-dashboard-unit .
      - run: docker run --rm mail-dashboard-unit
      - run: node scripts/smoke-hosted-container.mjs mail-dashboard-test
